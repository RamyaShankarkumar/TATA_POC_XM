name: Delay Trigger Service

on:
  workflow_dispatch

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger delay workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/delay-release.yml/dispatches \
            -d '{"ref":"main"}'
