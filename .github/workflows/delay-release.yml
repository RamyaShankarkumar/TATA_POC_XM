name: Delay Release

on:
  workflow_dispatch   # no inputs

permissions:
  contents: write

jobs:
  delay:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set fixed delay
        run: |
          DELAY_SECONDS=120   # 20 minutes

      - name: Update delay config
        run: |
          CONFIG_FILE="docs/data/release-config.json"

          mkdir -p docs/data

          if [ ! -f "$CONFIG_FILE" ]; then
            echo '{"delaySeconds": 0}' > "$CONFIG_FILE"
          fi

          jq ".delaySeconds = 120" "$CONFIG_FILE" > tmp.json
          mv tmp.json "$CONFIG_FILE"

          echo "Delay set to 1200 seconds (20 minutes)"

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/release-config.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "chore: delay release by 20 min"

          git pull origin main --rebase
          git push origin main
