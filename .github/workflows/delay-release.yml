name: Delay Release

on:
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: "Delay in minutes"
        required: true
        default: "20"

permissions:
  contents: write

jobs:
  delay:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update delay config
        run: |
          DELAY_SECONDS=$(( ${{ inputs.delay_minutes }} * 60 ))

          echo "Updating delay to $DELAY_SECONDS seconds"

          jq ".delaySeconds = $DELAY_SECONDS" release-config.json > tmp.json
          mv tmp.json release-config.json

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add release-config.json
          git commit -m "chore: delay release by ${{ inputs.delay_minutes }} min"
          git push
