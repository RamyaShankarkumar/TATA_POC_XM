name: Delay Release

on:
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: "Delay in minutes"
        required: true
        default: "20"

permissions:
  contents: write

jobs:
  delay:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set delay value
        run: |
          echo "DELAY_SECONDS=$(( ${{ inputs.delay_minutes }} * 60 ))" >> $GITHUB_ENV

      - name: Update delay config
        run: |
          CONFIG_FILE="docs/data/release-config.json"

          # Ensure folder exists
          mkdir -p docs/data

          # Create file if missing
          if [ ! -f "$CONFIG_FILE" ]; then
            echo '{"delaySeconds": 0}' > "$CONFIG_FILE"
          fi

          # Update value
          jq ".delaySeconds = $DELAY_SECONDS" "$CONFIG_FILE" > tmp.json
          mv tmp.json "$CONFIG_FILE"

          echo "Updated delay to $DELAY_SECONDS seconds"

      - name: Commit update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add release-config.json

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "chore: delay release by ${{ inputs.delay_minutes }} min"
          git push
