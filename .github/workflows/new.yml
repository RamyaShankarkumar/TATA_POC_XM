name: Auto Tag from Sprint Branch & Release Engine

on:
  workflow_dispatch:
    inputs:
      sprint_branch:
        required: true
        type: string
      confluence_page_id:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------
      # 1. Checkout sprint branch
      # -------------------------------
      - name: Checkout sprint branch
        run: |
          git fetch origin
          git checkout -B "${{ github.event.inputs.sprint_branch }}" \
            "origin/${{ github.event.inputs.sprint_branch }}"

      # -------------------------------
      # 2. Generate tag
      # -------------------------------
      - name: Generate tag
        id: tag
        run: |
          PREFIX=$(echo "${{ github.event.inputs.sprint_branch }}" | sed 's/\.x$//')
          LAST_TAG=$(git tag --list "${PREFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEXT=0
          else
            LAST_NUM=$(echo "$LAST_TAG" | awk -F'.' '{print $3}')
            NEXT=$((LAST_NUM + 1))
          fi

          echo "new_tag=${PREFIX}.${NEXT}" >> "$GITHUB_OUTPUT"

      # -------------------------------
      # 3. Load delay config (ONLY SOURCE OF TRUTH)
      # -------------------------------
      - name: Read Delay Config
        id: delay
        run: |
          CONFIG_FILE="docs/data/release-config.json"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo '{"delaySeconds":0}' > "$CONFIG_FILE"
          fi

          DELAY=$(jq -r '.delaySeconds // 0' "$CONFIG_FILE")
          echo "delay=$DELAY" >> "$GITHUB_OUTPUT"

      # -------------------------------
      # 4. Apply delay (SINGLE SLEEP ONLY)
      # -------------------------------
      - name: Apply Release Delay
        run: |
          DELAY=${{ steps.delay.outputs.delay }}

          if [ "$DELAY" -gt 0 ]; then
            echo "⏳ Applying delay: $DELAY seconds"
            sleep "$DELAY"
          else
            echo "No delay requested"
          fi

      # -------------------------------
      # 5. Wait for PRs to close
      # -------------------------------
      - name: Wait for PRs to close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while true; do
            COUNT=$(gh pr list \
              --base "${{ github.event.inputs.sprint_branch }}" \
              --state open \
              --jq 'length')

            echo "Open PRs: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "Waiting for PRs..."
            sleep 600
          done

      # -------------------------------
      # 6. Build commits + Jira + Confluence (UNCHANGED LOGIC)
      # -------------------------------
      - name: Get commits
        run: git log -20 --pretty=format:"%h|%s" > commits.txt

      - name: Extract Jira IDs
        run: grep -oiE '[A-Z]+-[0-9]+' commits.txt | sort -u > jira_ids.txt || true

      # (keep your Jira + Confluence steps EXACTLY as you already have)
      # I am not repeating them fully here to avoid noise

      # -------------------------------
      # 7. Create tag
      # -------------------------------
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      # -------------------------------
      # 8. Update dashboard + commit
      # -------------------------------
      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: release dashboard update"
          git push origin HEAD:${{ github.event.inputs.sprint_branch }}
